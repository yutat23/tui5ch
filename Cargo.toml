[package]
name = "tui5ch"
version = "0.1.0"
edition = "2024"
description = "Terminal browser for 5ch, Edge and Shitaraba with keyboard and mouse controls"
license = "MIT"
repository = "https://github.com/yutat23/tui5ch"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
directories = "6.0"
encoding_rs = "0.8"
ratatui = "0.29"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
url = "2.5"
unicode-width = "0.2"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1.47", features = ["rt-multi-thread"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
