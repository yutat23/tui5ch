name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: tui5ch-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.ref_type == 'tag' || startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag, version and changelog
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$REF_NAME"
          else
            RELEASE_TAG="${COMMIT_MESSAGE#chore: release }"
          fi
          python scripts/release.py validate --tag "$RELEASE_TAG" --output dist
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build binary
        run: cargo build --release --locked
      - name: Package binary and public documentation
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare release notes and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG" --output .local/release
          python scripts/release.py checksums --output dist
      - name: Create or verify annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if ref=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" 2>/dev/null); then
            tag_sha=$(jq -r '.object.sha' <<< "$ref")
            if [[ $(jq -r '.object.type' <<< "$ref") == "tag" ]]; then
              tag_sha=$(gh api "repos/$GH_REPO/git/tags/$tag_sha" --jq '.object.sha')
            fi
            if [[ "$tag_sha" != "$GITHUB_SHA" ]]; then
              echo "Release tag points to a different commit; refusing to move it."
              exit 1
            fi
          else
            tag_sha=$(gh api "repos/$GH_REPO/git/tags" \
              -f tag="$RELEASE_TAG" -f message="tui5ch $RELEASE_TAG" \
              -f object="$GITHUB_SHA" -f type=commit --jq '.sha')
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_sha"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json assets > .local/release/existing.json 2>/dev/null; then
            expected=$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
            actual=$(jq -r '.assets[].name' .local/release/existing.json | sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "Release already exists with different assets; check it before retrying."
              exit 1
            fi
            echo "Release and all expected assets already exist."
            exit 0
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "tui5ch $RELEASE_TAG" \
            --notes-file .local/release/release-notes.md "${flags[@]}"
