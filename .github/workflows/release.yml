name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag, version and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release.py validate --tag "$RELEASE_TAG" --output dist

  build:
    needs: validate
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test release packaging
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build binary
        run: cargo build --release --locked
      - name: Package binary and public documentation
        run: python scripts/release.py package
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare release notes and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release.py validate --tag "$RELEASE_TAG" --output .local/release
          python scripts/release.py checksums --output dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --title "tui5ch $RELEASE_TAG" \
            --notes-file .local/release/release-notes.md "${flags[@]}"
